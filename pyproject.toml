[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setwatch"
version = "0.1.0"
description = "Live external-risk intelligence for film and TV production"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "google-adk>=2.8,<3",
  "google-genai>=2.22,<3",
  "parallel-web>=1.3,<2",
  "pydantic-settings>=2.10",
  "python-dotenv>=1.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
