name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gemini-model: [gemini-2.5-flash, gemini-3.5-flash-lite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        env:
          SETWATCH_DEMO_MODE: "true"
          GEMINI_MODEL: ${{ matrix.gemini-model }}
        run: pytest -q
